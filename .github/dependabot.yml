version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
